<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#182434">
<title>AR Roster 2026 — Flying Car</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bbbd0;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block}.hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 6px #142434aa}.top{position:absolute;top:max(18px,env(safe-area-inset-top));left:7%;right:7%;display:flex;align-items:center;justify-content:space-between}.switch{pointer-events:auto;background:#18243477;border:1px solid #ffffff44;border-radius:32px;padding:4px;display:flex;backdrop-filter:blur(8px)}button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.switch button{min-width:82px;padding:10px 18px;border-radius:24px;background:transparent}.switch button.active{background:#fff;color:#172331;text-shadow:none}.switch button:disabled{opacity:.48}.restart{pointer-events:auto;width:48px;height:48px;border-radius:50%;background:#18243477;font-size:30px;line-height:1}.speed{text-align:center;font-size:clamp(38px,8vw,60px);font-weight:300;line-height:1}.speed small{display:block;font-size:12px;letter-spacing:2px}.meter{width:110px;height:4px;background:#ffffff55;margin:9px auto}.meter span{display:block;height:100%;background:#fff;width:40%;transition:width .15s}.controls{position:absolute;bottom:max(7%,env(safe-area-inset-bottom));left:7%;right:7%;display:flex;justify-content:space-between;align-items:flex-end}.pad{pointer-events:auto;width:min(30vw,190px);height:min(30vw,190px);border-radius:50%;background:#1b263b88;border:1px solid #ffffff55;position:relative;display:grid;place-items:center;box-shadow:inset 0 0 20px #0002}.pad:before{content:"‹                 ›";position:absolute;top:44%;font-size:24px;color:#ffffffbb;white-space:pre}.pad:after{content:"⌃";position:absolute;top:0;font-size:22px;color:#ffffffbb}.knob{width:42%;aspect-ratio:1;border-radius:50%;background:#fff;border:4px solid #3675ff;box-shadow:0 2px 8px #0005;position:relative;z-index:1;transform:translate(var(--x,0),var(--y,0));pointer-events:none}.knob:after{content:"";position:absolute;inset:40%;border-radius:50%;background:#3675ff}.actions{display:flex;align-items:center;gap:12px}.side{pointer-events:auto;width:68px;height:68px;border-radius:50%;background:#17233199;border:1px solid #ffffff55;font-weight:700;font-size:12px;display:grid;place-content:center;gap:1px}.side b{font-size:22px}.lift{pointer-events:auto;width:120px;height:120px;border-radius:50%;background:#fff;color:#142231;text-shadow:none;font-weight:800;font-size:15px;box-shadow:0 4px 16px #0003}.lift b{display:block;font-size:32px;color:#142231}.lift span{color:#3274ed;font-size:17px}.hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#15233399;padding:9px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .25s}.hint.show{opacity:1}@media(max-height:520px){.controls{bottom:4%}.pad{width:min(27vh,150px);height:min(27vh,150px)}.lift{width:92px;height:92px}.side{width:56px;height:56px}.top{top:10px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Flying car game scene"></canvas>
<div class="hud">
 <div class="top">
  <div class="switch" aria-label="Game mode"><button id="ar" disabled title="Camera AR needs a supported AR runtime">AR</button><button id="gameMode" class="active">ဂိမ်း</button></div>
  <button class="restart" id="restart" aria-label="Restart game">⟳</button>
  <div class="speed"><span id="speed">0</span><small>KM/H</small><div class="meter"><span id="meter"></span></div></div>
 </div>
 <div class="hint" id="hint"></div>
 <div class="controls">
  <div class="pad" id="pad" aria-label="Drag to steer"><div class="knob" id="knob"></div></div>
  <div class="actions">
   <button class="side" id="left"><b>⇦</b>LEFT</button>
   <button class="side" id="right"><b>⇨</b>RIGHT</button>
   <button class="lift" id="lift"><b>⌃</b><span>〰</span><br>LIFT</button>
  </div>
 </div>
</div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),speedEl=document.querySelector('#speed'),meter=document.querySelector('#meter'),pad=document.querySelector('#pad'),knob=document.querySelector('#knob'),hint=document.querySelector('#hint');
let w=0,h=0,dpr=1,steer=0,altitude=0,speed=0,distance=0,wind=0,last=0,keys={},touching=false;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function sky(){let g=ctx.createLinearGradient(0,0,0,h*.68);g.addColorStop(0,'#90b8d0');g.addColorStop(.52,'#d7e3e3');g.addColorStop(1,'#f1c59b');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);for(let i=0;i<7;i++){let x=((i*197+distance*.025)%(w+180))-80,y=h*(.12+(i%3)*.1);ctx.fillStyle=`rgba(255,255,255,${.12+(i%3)*.045})`;ctx.beginPath();ctx.ellipse(x,y,70+i%3*25,16+i%2*9,0,0,Math.PI*2);ctx.fill()}}
function building(x,base,bw,bh,color,idx){ctx.fillStyle=color;ctx.fillRect(x,base-bh,bw,bh);ctx.fillStyle='rgba(25,49,60,.35)';ctx.fillRect(x,base-bh,bw,5);let cols=Math.max(2,Math.floor(bw/15));for(let r=0;r<Math.floor(bh/19);r++)for(let c=0;c<cols;c++){let ww=Math.min(7,bw/cols*.48),xx=x+c*bw/cols+3,yy=base-bh+r*19+10;ctx.fillStyle=(r+c+idx)%4===0?'#f5d69c':'#b8d2d3';ctx.fillRect(xx,yy,ww,7)}}
function world(){sky();let horizon=h*.49+altitude*.11;ctx.fillStyle='#80989a';ctx.fillRect(0,horizon,w,h-horizon);let colors=['#a5aaa4','#c4b8a8','#8eaaa5','#bdc4bf','#a59691'];for(let i=0;i<17;i++){let z=(i*127-distance*.8)%(w+140);if(z<0)z+=w+140;let bw=38+(i*17%65),bh=h*(.08+(i*37%24)/100);building(z-bw/2,horizon+8,bw,bh,colors[i%colors.length],i)}
// Rooftop in the foreground gives a moving reference surface.
ctx.save();ctx.translate(w/2+steer*w*.1,h*.69-altitude*.22);ctx.fillStyle='#747d79';ctx.beginPath();ctx.moveTo(-w*.8,-h*.03);ctx.lineTo(w*.8,-h*.03);ctx.lineTo(w*1.35,h*.55);ctx.lineTo(-w*1.35,h*.55);ctx.closePath();ctx.fill();ctx.strokeStyle='#aeb5af';ctx.lineWidth=2;for(let i=-9;i<=9;i++){ctx.beginPath();ctx.moveTo(i*w*.11,-h*.03);ctx.lineTo(i*w*.19,h*.55);ctx.stroke()}ctx.strokeStyle='#59635f';ctx.lineWidth=1;for(let j=1;j<8;j++){let y=h*.02+j*j*h*.008;ctx.beginPath();ctx.moveTo(-w*.8-j*20,y);ctx.lineTo(w*.8+j*20,y);ctx.stroke()}for(let i=0;i<5;i++){let x=(i-2)*w*.19+Math.sin(distance/80+i)*12,y=h*.04+i%2*18;ctx.fillStyle='#68716f';ctx.beginPath();ctx.ellipse(x,y,12,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a8aeaa';ctx.beginPath();ctx.ellipse(x,y-4,9,6,0,0,Math.PI*2);ctx.fill()}ctx.restore();}
function car(){let cx=w/2+steer*w*.12,cy=h*.66-altitude*.2;ctx.save();ctx.translate(cx,cy);ctx.rotate(steer*.07);let sc=Math.min(w/360,1.3);ctx.scale(sc,sc);ctx.fillStyle='#15253344';ctx.beginPath();ctx.ellipse(0,61,75,15,0,0,Math.PI*2);ctx.fill();if(altitude>8){ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=8;ctx.lineCap='round';for(let x of [-34,34]){ctx.beginPath();ctx.moveTo(x,25);ctx.quadraticCurveTo(x+steer*7,55+Math.random()*10,x+steer*12,75+Math.random()*12);ctx.stroke()}}ctx.fillStyle='#f7f8f6';ctx.strokeStyle='#53616a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-68,0);ctx.lineTo(-50,-22);ctx.quadraticCurveTo(-40,-31,-20,-29);ctx.lineTo(27,-22);ctx.quadraticCurveTo(48,-18,64,3);ctx.lineTo(72,10);ctx.lineTo(67,22);ctx.lineTo(-58,22);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#384954';ctx.beginPath();ctx.moveTo(-39,-21);ctx.lineTo(-17,-25);ctx.lineTo(-2,-24);ctx.lineTo(5,-5);ctx.lineTo(-49,-5);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(2,-23);ctx.lineTo(26,-19);ctx.quadraticCurveTo(41,-16,53,-5);ctx.lineTo(8,-5);ctx.closePath();ctx.fill();ctx.fillStyle='#28343c';for(let x of [-38,38]){ctx.beginPath();ctx.ellipse(x,20,16,19,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#849096';ctx.beginPath();ctx.ellipse(x,20,7,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#28343c'}ctx.restore()}
function frame(t){let dt=Math.min((t-last)/1000||0,.05);last=t;const lifting=keys.Space||keys.ArrowUp||keys.w||keys.W||keys.lift;const accel=keys.ArrowRight||keys.d||keys.D?1:keys.ArrowLeft||keys.a||keys.A?-1:0;steer+=(accel-steer)*Math.min(1,dt*4);speed+=(lifting?22:-4)*dt;speed=Math.max(0,Math.min(180,speed));altitude+=(lifting?30:-12)*dt;altitude=Math.max(0,Math.min(180,altitude));distance+=speed*dt*.2;wind+=dt;world();car();speedEl.textContent=Math.round(speed);meter.style.width=(speed/180*100)+'%';requestAnimationFrame(frame)}requestAnimationFrame(frame);
function setSteer(v){steer=v;knob.style.setProperty('--x',(v*32)+'px');knob.style.setProperty('--y','0px')}
function padMove(e){let r=pad.getBoundingClientRect(),v=(e.clientX-(r.left+r.width/2))/(r.width*.42);setSteer(Math.max(-1,Math.min(1,v)))}pad.addEventListener('pointerdown',e=>{touching=true;pad.setPointerCapture(e.pointerId);padMove(e)});pad.addEventListener('pointermove',e=>{if(touching)padMove(e)});function padEnd(){touching=false;setSteer(0)}pad.addEventListener('pointerup',padEnd);pad.addEventListener('pointercancel',padEnd);
function bindHold(id,key){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;el.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>keys[key]=false)}bindHold('lift','lift');bindHold('left','ArrowLeft');bindHold('right','ArrowRight');addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);addEventListener('blur',()=>keys={});
document.querySelector('#restart').addEventListener('click',()=>{speed=0;altitude=0;distance=0;steer=0;hint.textContent='ဂိမ်းကို ပြန်စပါပြီ';hint.classList.add('show');setTimeout(()=>hint.classList.remove('show'),1200)});
})();
</script>
</body>
</html>
